name: Build and VM-test beta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: animation-beta-publish
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Verify public/private boundary
        run: python3 tests/public_boundary.py
      - name: Static verification
        run: python3 tests/static_smoke.py
      - name: Build offline-capable browser bundle
        run: npm run build:web
      - name: Chromium WebGL interaction tests
        run: npm run test:browser
      - name: Build Debian installer
        run: bash scripts/build-deb.sh
      - name: Verify Debian package
        run: |
          dpkg-deb --info dist/animation-studio-beta_0.4.0_all.deb
          dpkg-deb --contents dist/animation-studio-beta_0.4.0_all.deb | grep '/opt/animation-studio/app.bundle.js'
      - name: VM Debian extraction and Python launcher smoke checks
        run: |
          mkdir -p /tmp/animation-studio-pkg
          dpkg-deb -x dist/animation-studio-beta_0.4.0_all.deb /tmp/animation-studio-pkg
          test -s /tmp/animation-studio-pkg/opt/animation-studio/app.bundle.js
          test -s /tmp/animation-studio-pkg/opt/animation-studio/index.html
          python3 -m py_compile /tmp/animation-studio-pkg/usr/bin/animation-studio-beta
      - name: Package standalone web preview
        run: cd web-dist && zip -qr ../dist/animation-studio-web-v0.4.0-beta.1.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-beta-build
          path: |
            dist/
            web-dist/
  release:
    needs: verify-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vm-beta-build
          path: artifacts
      - name: Publish validated v0.4.0 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG=v0.4.0-beta.1
          DEB=$(find artifacts -name 'animation-studio-beta_0.4.0_all.deb' -print -quit)
          WEB=$(find artifacts -name 'animation-studio-web-v0.4.0-beta.1.zip' -print -quit)
          test -s "$DEB" && test -s "$WEB"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists; not overwriting."
          else
            gh release create "$TAG" "$DEB" "$WEB" --target "$GITHUB_SHA" --title "Animation Studio v0.4.0 Beta 1" --prerelease --notes "Self-contained browser app (no Three.js CDN required), cached sculpt smoothing, in-app feedback, and automated Chromium/WebGL VM regression tests. Experimental beta; further manual QA recommended."
          fi
  pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: verify-build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vm-beta-build
          path: artifacts
      - run: |
          mkdir -p _site/downloads
          cp artifacts/web-dist/* _site/
          cp artifacts/dist/* _site/downloads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
