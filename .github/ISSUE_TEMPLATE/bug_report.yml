name: Bug report
description: Report a reproducible defect in Animation Studio beta
title: "[Bug] "
labels: []
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options: [Model, Sculpt, Paint, Animate, Edit, AI, Experimental, Installer, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact object selected and actions performed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and browser console errors
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, browser version and device details
    validations:
      required: true
